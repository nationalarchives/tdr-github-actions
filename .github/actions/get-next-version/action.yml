name: 'Get the next version'
description: 'Gets the next version based on the existing git tag'
inputs:
  repo-name:
    description: 'The name of the repository'
    required: true
  snapshot:
    description: >
      If true, do not bump the version. Instead return the current version
      suffixed with -SNAPSHOT-dev-<actor>, for ad hoc developer builds of dev
      snapshots. Snapshot tags are never treated as the "current" version, so
      they can never affect version calculations for real releases.
    required: false
    default: 'false'
outputs:
  next-version:
    description: The next version for the repository
    value: ${{ steps.next-tag.outputs.next-version }}
runs:
  using: "composite"
  steps:
    - run: pip install requests semver
      shell: bash
    - id: next-tag
      env:
        GITHUB_API_URL: ${{ github.api_url }}
        REPO_NAME: ${{ inputs.repo-name }}
        SNAPSHOT: ${{ inputs.snapshot }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        python - <<'PY'
        import os
        import re
        import semver
        import requests

        github_api_url = os.environ["GITHUB_API_URL"]
        repo_name = os.environ["REPO_NAME"]
        snapshot = os.environ.get("SNAPSHOT", "false") == "true"
        tags = requests.get(f"{github_api_url}/repos/nationalarchives/{repo_name}/tags").json()

        # Snapshot tags are never the basis for a version calculation, real
        # or snapshot, so they're filtered out here.
        release_tags = [tag for tag in tags if "-SNAPSHOT-" not in tag["name"]]
        version = release_tags[0]["name"]

        with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
          if snapshot:
            print(f"next-version={version}-SNAPSHOT-dev-{os.environ['GITHUB_ACTOR']}", file=fh)
          elif re.search(r"v\d*$", version) is not None:
            print(f"next-version=v{int(version[1:]) + 1}", file=fh)
          else:
            next_version = str(semver.parse_version_info(version[1:]).bump_patch())
            print(f"next-version=v{next_version}", file=fh)
        PY
      shell: bash
