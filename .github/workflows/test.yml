name: TDR Run custom action tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: |
          echo "111111111111" > tmp
          git add tmp
      - uses: nationalarchives/tdr-github-actions/.github/actions/run-git-secrets@68960904fc1b628f92756d3f760e7ab64cfe95f2 # v0.0.44
        id: run-git-secrets
        continue-on-error: true
      - run: exit 1
        continue-on-error: false
        if: steps.run-git-secrets.outcome == 'success'
