name: Tag and release TDR Github Actions
on:
  push:
    branches:
      - main
jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    # Skip if the commit is from dependabot updating self-references
    if: |
      !contains(github.event.head_commit.message, 'nationalarchives/tdr-github-actions') ||
      !contains(github.event.head_commit.author.name, 'dependabot')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: next-tag
        uses: nationalarchives/tdr-github-actions/.github/actions/get-next-version@e3622e3bbb9019981b3aaf6b278b2fce0c7d812b # v0.0.40
        with:
          repo-name: tdr-github-actions
      - name: Create tag and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.next-tag.outputs.next-version }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          gh release create "$NEXT_VERSION"
